      top: 0;
      z-index: 10;

    .hero {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;

      text-align: center;

    .hero h1 {
      font-size: 38px;

    .hero p {
      color: #e5e7eb;

    .search {

      padding: 15px 18px;

      outline: none;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title h2 {
      font-size: 24px;
    }

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 35px;
    }

      border-radius: 10px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    }

    .category-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

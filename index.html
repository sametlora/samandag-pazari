<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samandağ Pazarı</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#222
}

header{
 background:#111827;
 color:#fff;
 padding:15px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 font-size:25px;
 font-weight:bold;
 position:sticky;
 top:0;
 z-index:100
}

.header-left{
 display:flex;
 align-items:center;
 gap:8px
}

.header-actions{
 display:flex;
 align-items:center;
 gap:8px
}

.header-btn{
 width:auto;
 margin:0;
 padding:9px 13px;
 background:#fff;
 color:#111827;
 border:0;
 border-radius:8px;
 cursor:pointer;
 font-size:13px
}

.header-btn.orange{
 background:#ff6a00;
 color:#fff
}

.container{
 max-width:1200px;
 margin:auto;
 padding:20px
}

.form-box,.search-box,.membership-box{
 background:#fff;
 border-radius:12px;
 box-shadow:0 2px 10px rgba(0,0,0,.08)
}

.form-box{
 padding:20px;
 margin-bottom:20px
}

.form-box h2{
 margin-top:0
}

input,textarea,select,button{
 width:100%;
 padding:12px;
 margin-top:8px;
 margin-bottom:12px;
 border:1px solid #ddd;
 border-radius:8px;
 font-size:15px
}

textarea{
 min-height:100px;
 resize:vertical
}

button{
 background:#111827;
 color:#fff;
 border:none;
 cursor:pointer;
 font-weight:bold
}

button:hover{
 opacity:.9
}

#ilanVerBtn{
 background:#ff6a00
}

.search-box{
 padding:15px;
 margin-bottom:15px
}

.search-box input{
 margin:0
}

.categories{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:20px
}

.category-btn{
 width:auto;
 margin:0;
 padding:9px 14px;
 background:#fff;
 color:#333;
 border:1px solid #ddd
}

.category-btn.active{
 background:#111827;
 color:#fff
}

/* ÜYELİK */
.membership-box{
 display:none;
 padding:25px;
 margin-bottom:20px
}

.membership-box.open{
 display:block
}

.membership-header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px
}

.membership-header h2{
 margin:0
}

.membership-close{
 width:auto;
 margin:0;
 background:#e5e7eb;
 color:#111827;
 padding:8px 13px
}

.membership-status{
 background:#f3f4f6;
 border-radius:10px;
 padding:15px;
 margin-bottom:20px;
 line-height:1.7
}

.membership-status strong{
 color:#111827
}

.trial-badge{
 display:inline-block;
 background:#dcfce7;
 color:#166534;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold
}

.expired-badge{
 display:inline-block;
 background:#fee2e2;
 color:#991b1b;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold
}

.packages{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px
}

.package{
 border:1px solid #ddd;
 border-radius:12px;
 padding:20px;
 background:#fff;
 position:relative
}

.package:hover{
 border-color:#ff6a00;
 box-shadow:0 5px 18px rgba(0,0,0,.08)
}

.package.featured{
 border:2px solid #ff6a00
}

.package-label{
 position:absolute;
 top:-11px;
 left:15px;
 background:#ff6a00;
 color:#fff;
 padding:5px 10px;
 border-radius:15px;
 font-size:11px;
 font-weight:bold
}

.package h3{
 margin:5px 0 8px;
 font-size:20px
}

.package-price{
 font-size:27px;
 font-weight:bold;
 color:#dc2626;
 margin-bottom:5px
}

.package-duration{
 color:#666;
 font-size:13px;
 margin-bottom:12px
}

.package-info{
 color:#555;
 font-size:13px;
 line-height:1.6;
 margin-bottom:15px
}

.package-btn{
 background:#ff6a00;
 color:#fff;
 margin:0
}

/* İLANLAR */
#listings{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
 gap:20px
}

.card{
 background:#fff;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 3px 12px rgba(0,0,0,.1)
}

.card-image{
 height:400px;
 background:#eee;
 position:relative;
 cursor:pointer;
 overflow:hidden
}

.card-image img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block
}

.photo-count{
 position:absolute;
 right:10px;
 bottom:10px;
 background:rgba(0,0,0,.7);
 color:#fff;
 padding:6px 9px;
 border-radius:7px;
 font-size:13px
}

.card-body{
 padding:16px
}

.card-title{
 font-size:20px;
 font-weight:bold;
 margin-bottom:8px
}

.price{
 color:#dc2626;
 font-size:20px;
 font-weight:bold;
 margin-bottom:10px
}

.description{
 color:#555;
 line-height:1.5;
 white-space:pre-wrap;
 margin-bottom:10px
}

.info{
 color:#555;
 font-size:14px;
 margin-top:6px
}

.contact-buttons{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px
}

.contact-buttons a{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 text-decoration:none;
 padding:10px 13px;
 border-radius:8px;
 font-weight:bold;
 color:#fff;
 transition:.2s
}

.contact-buttons .phone{
 background:#16a34a
}

.contact-buttons .whatsapp-btn{
 background:#25d36

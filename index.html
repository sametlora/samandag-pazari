<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samandağ Pazarı</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px;
    }

    .top-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .search {
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .category-btn {
      background: white;
      border: 1px solid #ddd;
      color: #333;
    }

    .category-btn.active {
      background: #111827;
      color: white;
    }

    .listings {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      transition: transform .15s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-image {
      height: 320px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      font-size: 55px;
    }

    .photo-count {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(0,0,0,.72);
      color: white;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 13px;
    }

    .card-body {
      padding: 15px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .price {
      color: #16a34a;
      font-weight: bold;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .description {
      color: #555;
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .info {
      font-size: 13px;
      color: #666;
      margin: 5px 0;
    }

    .phone {
      display: inline-block;
      margin-top: 10px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
      background: white;
      border-radius: 14px;
    }

    .preview-title {
      margin-top: 5px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .preview-item {
      height: 90px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #eee;
      border: 1px solid #ddd;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-number {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0,0,0,.7);
      color: white;
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 11px;
    }

    .status {
      margin: 10px 0;
      font-size: 14px;
      font-weight: bold;
    }

    /* GALERİ */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0,0,0,.92);
      padding: 20px;
    }

    .modal.active {
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
    }

    .close-btn {
      background: #ef4444;
      color: white;
      font-size: 20px;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
    }

    .gallery-main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gallery-main img {
      max-width: 90%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: #111;
      font-size: 28px;
      padding: 0;
      z-index: 2;
    }

    .gallery-prev {
      left: 10px;
    }

    .gallery-next {
      right: 10px;
    }

    .thumbnails {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
      justify-content: center;
    }

    .thumbnail {
      width: 70px;
      height: 60px;
      flex: 0 0 auto;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .thumbnail.active {
      border-color: white;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .listings {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card-image {
        height: 220px;
      }

      .card-body {
        padding: 10px;
      }

      .card-title {
        font-size: 15px;
      }

      .price {
        font-size: 16px;
      }

      .preview-grid {
        grid-template-columns: repeat(5, 1fr);
      }

      .preview-item {
        height: 65px;
      }

      .gallery-main img {
        max-width: 100%;
        max-height: 65vh;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Samandağ Pazarı</h1>
  <p>Samandağ'da alım satımın adresi</p>
</header>

<div class="container">

  <div class="top-area">

    <!-- İLAN EKLE -->
    <div class="box">
      <h2>📢 İlan Ver</h2>

      <form id="ilanForm">

        <label>İlan Başlığı</label>
        <input
          type="text"
          id="baslik"
          placeholder="Örn: iPhone 13"
          required
        >

        <label>Fiyat</label>
        <input
          type="number"
          id="fiyat"
          placeholder="Örn: 25000"
          min="0"
          required
        >

        <label>Açıklama</label>
        <textarea
          id="aciklama"
          placeholder="Ürün hakkında bilgi yazın..."
          required
        ></textarea>

        <label>Kategori</label>
        <select id="kategori" required>
          <option value="">Kategori seçin</option>
          <option value="Elektronik">Elektronik</option>
          <option value="Araç">Araç</option>
          <option value="Ev">Ev</option>
          <option value="Emlak">Emlak</option>
          <option value="Giyim">Giyim</option>
          <option value="Telefon">Telefon</option>
          <option value="İş">İş</option>
          <option value="Diğer">Diğer</option>
        </select>

        <label>Mahalle</label>
        <input
          type="text"
          id="mahalle"
          placeholder="Örn: Çiğdede Mahallesi"
          required
        >

        <label>Telefon</label>
        <input
          type="tel"
          id="telefon"
          placeholder="Örn: 05312386845"
          required
        >

        <label>Fotoğraflar</label>
        <input
          type="file"
          id="resimler"
          accept="image/*"
          multiple
        >

        <div class="preview-title">
          En fazla 10 fotoğraf seçebilirsiniz.
        </div>

        <div id="previewGrid" class="preview-grid"></div>

        <div id="status" class="status"></div>

        <button
          type="submit"
          id="submitBtn"
          class="btn-primary"
        >
          🚀 İlanı Yayınla
        </button>

      </form>
    </div>

    <!-- ARAMA -->
    <div class="box">
      <h2>🔎 İlan Ara</h2>

      <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="İlan, kategori veya mahalle ara..."
      >

      <div class="categories">
        <button class="category-btn active" data-category="Tümü">
          Tümü
        </button>

        <button class="category-btn" data-category="Elektronik">
          Elektronik
        </button>

        <button class="category-btn" data-category="Araç">
          Araç
        </button>

        <button class="category-btn" data-category="Ev">
          Ev
        </button>

        <button class="category-btn" data-category="Emlak">
          Emlak
        </button>

        <button class="category-btn" data-category="Giyim">
          Giyim
        </button>

        <button class="category-btn" data-category="Telefon">
          Telefon
        </button>

        <button class="category-btn" data-category="İş">
          İş
        </button>

        <button class="category-btn" data-category="Diğer">
          Diğer
        </button>
      </div>
    </div>

  </div>

  <h2>📋 Güncel İlanlar</h2>

  <div id="listings" class="listings">
    <div class="empty">İlanlar yükleniyor...</div>
  </div>

</div>


<!-- GALERİ MODALI -->

<div id="galleryModal" class="modal">

  <div class="modal-header">
    <div id="galleryTitle" class="modal-title">
      Fotoğraflar
    </div>

    <button
      id="closeGallery"
      class="close-btn"
      type="button"
    >
      ×
    </button>
  </div>

  <div class="gallery-main">

    <button
      id="galleryPrev"
      class="gallery-arrow gallery-prev"
      type="button"
    >
      ‹
    </button>

    <img
      id="galleryImage"
      src=""
      alt="İlan fotoğrafı"
    >

    <button
      id="galleryNext"
      class="gallery-arrow gallery-next"
      type="button"
    >
      ›
    </button>

  </div>

  <div id="thumbnails" class="thumbnails"></div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://hicevhodrskuymffgbdo.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wCUwLT4hjbddEjWY_HJEJQ_oTlTeUiB";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==========================================
  // DEĞİŞKENLER
  // ==========================================

  let allListings = [];
  let selectedCategory = "Tümü";

  let galleryImages = [];
  let galleryIndex = 0;


  // ==========================================
  // HTML GÜVENLİĞİ
  // ==========================================

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ==========================================
  // FOTOĞRAF URL'LERİNİ AL
  // ==========================================

  function getImageUrls(resimurl) {

    if (!resimurl) {
      return [];
    }

    // Yeni sistem: JSON array
    try {

      const parsed = JSON.parse(resimurl);

      if (Array.isArray(parsed)) {
        return parsed.filter(Boolean);
      }

    } catch (error) {
      // Eski tek fotoğraf sistemi olabilir
    }

    // Eski sistem: tek URL
    if (typeof resimurl === "string") {
      return [resimurl];
    }

    return [];
  }


  // ==========================================
  // FOTOĞRAF ÖNİZLEME
  // ==========================================

  document
    .getElementById("resimler")
    .addEventListener("change", function(event) {

      const files = Array.from(event.target.files);

      const previewGrid =
        document.getElementById("previewGrid");

      previewGrid.innerHTML = "";

      if (files.length > 10) {

        alert("En fazla 10 fotoğraf seçebilirsiniz.");

        event.target.value = "";

        return;
      }

      files.forEach((file, index) => {

        if (!file.type.startsWith("image/")) {
          return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

          const div =
            document.createElement("div");

          div.className = "preview-item";

          div.innerHTML = `
            <img
              src="${e.target.result}"
              alt="Fotoğraf ${index + 1}"
            >

            <span class="preview-number">
              ${index + 1}
            </span>
          `;

          previewGrid.appendChild(div);
        };

        reader.readAsDataURL(file);
      });
    });


  // ==========================================
  // FOTOĞRAF YÜKLE
  // ==========================================

  async function uploadImage(file, index, total) {

    const extension =
      file.name.split(".").pop().toLowerCase();

    const randomName =
      Date.now() +
      "-" +
      crypto.randomUUID() +
      "-" +
      index +
      "." +
      extension;

    const filePath =
      "ilan-" +
      randomName;

    const status =
      document.getElementById("status");

    status.textContent =
      `📤 Fotoğraf ${index} / ${total} yükleniyor...`;

    const { error } =
      await supabaseClient
        .storage
        .from("ilan-fotograflari")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false
        });

    if (error) {
      throw error;
    }

    const { data } =
      supabaseClient
        .storage
        .from("ilan-fotograflari")
        .getPublicUrl(filePath);

    return {
      url: data.publicUrl,
      path: filePath
    };
  }


  // ==========================================
  // İLAN EKLE
  // ==========================================

  document
    .getElementById("ilanForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const submitBtn =
        document.getElementById("submitBtn");

      const status =
        document.getElementById("status");

      const files =
        Array.from(
          document.getElementById("resimler").files
        );

      if (files.length > 10) {

        alert("En fazla 10 fotoğraf yükleyebilirsiniz.");

        return;
      }


      // Her fotoğraf için maksimum 5 MB
      for (const file of files) {

        if (!file.type.startsWith("image/")) {

          alert(
            `"${file.name}" bir fotoğraf değil.`
          );

          return;
        }

        if (file.size > 5 * 1024 * 1024) {

          alert(
            `"${file.name}" 5 MB'dan büyük.`
          );

          return;
        }
      }


      submitBtn.disabled = true;

      status.textContent =
        "⏳ İlan hazırlanıyor...";


      const uploadedFiles = [];
      const imageUrls = [];


      try {

        // ====================================
        // FOTOĞRAFLARI YÜKLE
        // ====================================

        for (
          let i = 0;
          i < files.length;
          i++
        ) {

          const result =
            await uploadImage(
              files[i],
              i + 1,
              files.length
            );

          uploadedFiles.push(result.path);

          imageUrls.push(result.url);
        }


        // ====================================
        // İLANI VERİTABANINA EKLE
        // ====================================

        status.textContent =
          "💾 İlan kaydediliyor...";


        const ilanData = {

          baslik:
            document
              .getElementById("baslik")
              .value
              .trim(),

          fiyat:
            Number(
              document
                .getElementById("fiyat")
                .value
            ),

          aciklama:
            document
              .getElementById("aciklama")
              .value
              .trim(),

          kategori:
            document
              .getElementById("kategori")
              .value,

          mahalle:
            document
              .getElementById("mahalle")
              .value
              .trim(),

          telefon:
            document
              .getElementById("telefon")
              .value
              .trim(),

          // 10 fotoğrafın URL'lerini JSON olarak sakla
          resimurl:
            imageUrls.length > 0
              ? JSON.stringify(imageUrls)
              : null
        };


        const { error } =
          await supabaseClient
            .from("ilantable")
            .insert([ilanData]);


        if (error) {
          throw error;
        }


        // ====================================
        // BAŞARILI
        // ====================================

        status.textContent =
          "✅ İlanınız başarıyla yayınlandı!";

        alert(
          "İlan başarıyla yayınlandı! 🎉"
        );


        document
          .getElementById("ilanForm")
          .reset();

        document
          .getElementById("previewGrid")
          .innerHTML = "";


        await loadListings();


      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Hata: " + error.message;

        alert(
          "İlan eklenirken hata oluştu:\n\n" +
          error.message
        );

      } finally {

        submitBtn.disabled = false;

      }

    });


  // ==========================================
  // İLANLARI GETİR
  // ==========================================

  async function loadListings() {

    const listings =
      document.getElementById("listings");

    listings.innerHTML =
      `<div class="empty">İlanlar yükleniyor...</div>`;


    const { data, error } =
      await supabaseClient
        .from("ilantable")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      listings.innerHTML = `
        <div class="empty">
          İlanlar yüklenirken hata oluştu.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;
    }


    allListings = data || [];

    displayListings();

  }


  // ==========================================
  // İLANLARI GÖSTER
  // ==========================================

  function displayListings() {

    const listings =
      document.getElementById("listings");

    const search =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      allListings.filter(ilan => {

        const imageText =
          [
            ilan.baslik,
            ilan.aciklama,
            ilan.kategori,
            ilan.mahalle
          ]
            .join(" ")
            .toLowerCase();


        const searchMatch =
          !search ||
          imageText.includes(search);


        const categoryMatch =
          selectedCategory === "Tümü" ||
          ilan.kategori === selectedCategory;


        return (
          searchMatch &&
          categoryMatch
        );

      });


    if (filtered.length === 0) {

      listings.innerHTML = `
        <div class="empty">
          Henüz ilan bulunamadı.
        </div>
      `;

      return;
    }


    listings.innerHTML = "";


    filtered.forEach(ilan => {

      const urls =
        getImageUrls(ilan.resimurl);

      const card =
        document.createElement("div");

      card.className = "card";


      // ====================================
      // FOTOĞRAF ALANI
      // ====================================

      const imageArea =
        document.createElement("div");

      imageArea.className =
        "card-image";


      if (urls.length > 0) {

        const img =
          document.createElement("img");

        img.src = urls[0];

        img.alt =
          ilan.baslik || "İlan fotoğrafı";

        img.loading = "lazy";

        imageArea.appendChild(img);


        if (urls.length > 1) {

          const count =
            document.createElement("div");

          count.className =
            "photo-count";

          count.textContent =
            `📷 ${urls.length} fotoğraf`;

          imageArea.appendChild(count);
        }


        imageArea.addEventListener(
          "click",
          function() {

            openGallery(
              urls,
              ilan.baslik || "İlan fotoğrafları"
            );

          }
        );

      } else {

        const noImage =
          document.createElement("div");

        noImage.className =
          "no-image";

        noImage.textContent = "📦";

        imageArea.appendChild(noImage);

      }


      // ====================================
      // İLAN BİLGİLERİ
      // ====================================

      const body =
        document.createElement("div");

      body.className =
        "card-body";


      const title =
        document.createElement("div");

      title.className =
        "card-title";

      title.textContent =
        ilan.baslik || "";

      body.appendChild(title);


      const price =
        document.createElement("div");

      price.className =
        "price";

      price.textContent =
        ilan.fiyat
          ? Number(ilan.fiyat).toLocaleString("tr-TR") + " TL"
          : "Fiyat belirtilmedi";

      body.appendChild(price);


      const description =
        document.createElement("div");

      description.className =
        "description";

      description.textContent =
        ilan.aciklama || "";

      body.appendChild(description);


      const category =
        document.createElement("div");

      category.className =
        "info";

      category.textContent =
        "📁 " +
        (ilan.kategori || "Diğer");

      body.appendChild(category);


      const neighborhood =
        document.createElement("div");

      neighborhood.className =
        "info";

      neighborhood.textContent =
        "📍 " +
        (ilan.mahalle || "");

      body.appendChild(neighborhood);


      if (ilan.telefon) {

        const phone =
          document.createElement("a");

        phone.className =
          "phone";

        phone.href =
          "tel:" +
          ilan.telefon.replace(
            /[^0-9+]/g,
            ""
          );

        phone.textContent =
          "📞 " + ilan.telefon;

        phone.addEventListener(
          "click",
          function(event) {
            event.stopPropagation();
          }
        );

        body.appendChild(phone);

      }


      card.appendChild(imageArea);
      card.appendChild(body);

      listings.appendChild(card);

    });

  }


  // ==========================================
  // ARAMA
  // ==========================================

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      displayListings
    );


  // ==========================================
  // KATEGORİLER
  // ==========================================

  document
    .querySelectorAll(".category-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".category-btn")
            .forEach(btn => {
              btn.classList.remove("active");
            });


          this.classList.add("active");


          selectedCategory =
            this.dataset.category;


          displayListings();

        }
      );

    });


  // ==========================================
  // GALERİYİ AÇ
  // ==========================================

  function openGallery(images, title) {

    if (!images || images.length === 0) {
      return;
    }

    galleryImages = images;

    galleryIndex = 0;


    document
      .getElementById("galleryTitle")
      .textContent = title;


    document
      .getElementById("galleryModal")
      .classList.add("active");


    renderGallery();

  }


  // ==========================================
  // GALERİ GÖRÜNTÜLE
  // ==========================================

  function renderGallery() {

    const image =
      document.getElementById("galleryImage");

    image.src =
      galleryImages[galleryIndex];


    image.alt =
      `Fotoğraf ${galleryIndex + 1}`;


    const thumbnails =
      document.getElementById("thumbnails");

    thumbnails.innerHTML = "";


    galleryImages.forEach(
      (url, index) => {

        const thumb =
          document.createElement("div");

        thumb.className =
          "thumbnail";


        if (index === galleryIndex) {
          thumb.classList.add("active");
        }


        const img =
          document.createElement("img");

        img.src = url;

        img.alt =
          `Küçük fotoğraf ${index + 1}`;


        thumb.appendChild(img);


        thumb.addEventListener(
          "click",
          function() {

            galleryIndex = index;

            renderGallery();

          }
        );


        thumbnails.appendChild(thumb);

      }
    );

  }


  // ==========================================
  // GALERİ KAPAT
  // ==========================================

  document
    .getElementById("closeGallery")
    .addEventListener(
      "click",
      function() {

        document
          .getElementById("galleryModal")
          .classList.remove("active");

      }
    );


  // ==========================================
  // ÖNCEKİ FOTOĞRAF
  // ==========================================

  document
    .getElementById("galleryPrev")
    .addEventListener(
      "click",
      function() {

        if (galleryImages.length === 0) {
          return;
        }

        galleryIndex--;

        if (galleryIndex < 0) {
          galleryIndex =
            galleryImages.length - 1;
        }

        renderGallery();

      }
    );


  // ==========================================
  // SONRAKİ FOTOĞRAF
  // ==========================================

  document
    .getElementById("galleryNext")
    .addEventListener(
      "click",
      function() {

        if (galleryImages.length === 0) {
          return;
        }

        galleryIndex++;

        if (
          galleryIndex >=
          galleryImages.length
        ) {
          galleryIndex = 0;
        }

        renderGallery();

      }
    );


  // ==========================================
  // KLAVYE İLE GALERİ
  // ==========================================

  document.addEventListener(
    "keydown",
    function(event) {

      const modal =
        document.getElementById("galleryModal");

      if (
        !modal.classList.contains("active")
      ) {
        return;
      }


      if (event.key === "Escape") {

        modal.classList.remove("active");

      }


      if (event.key === "ArrowLeft") {

        document
          .getElementById("galleryPrev")
          .click();

      }


      if (event.key === "ArrowRight") {

        document
          .getElementById("galleryNext")
          .click();

      }

    }
  );


  // ==========================================
  // BAŞLANGIÇ
  // ==========================================

  loadListings();

</script>

</body>
</html>

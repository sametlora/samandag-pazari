      font-size: 24px;

    .form-group input,

    .form-group select {

    .form-group textarea {

      }

  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Samandağ <span>Pazarı</span></div>

    <button class="add-btn" onclick="openModal()">
      + İlan Ver
    </button>
  </div>
</header>

<section class="hero">
  <h1>Samandağ Pazarı</h1>
  <p>Samandağ'da al, sat, keşfet.</p>

  <input
    class="search"
    type="text"
    placeholder="Ne arıyorsunuz? Örn: araba, telefon, ev..."
    onkeyup="searchListings(this.value)"
  >
</section>

<main>

  <div class="section-title">
    <h2>Kategoriler</h2>
  </div>

  <div class="categories">

    <div class="category" onclick="filterCategory('Araç')">
      <div class="category-icon">🚗</div>
      <div>Araç</div>
    </div>

    <div class="category" onclick="filterCategory('Emlak')">
      <div class="category-icon">🏠</div>
      <div>Emlak</div>
    </div>

    <div class="category" onclick="filterCategory('Elektronik')">
      <div class="category-icon">📱</div>
      <div>Elektronik</div>
    </div>

    <div class="category" onclick="filterCategory('Ev Eşyası')">
      <div class="category-icon">🪑</div>
      <div>Ev Eşyası</div>
    </div>

    <div class="category" onclick="filterCategory('İş İlanları')">
      <div class="category-icon">💼</div>
      <div>İş İlanları</div>
    </div>

    <div class="category" onclick="filterCategory('Diğer')">
      <div class="category-icon">📦</div>
      <div>Diğer</div>
    </div>

  </div>

  <div class="section-title">
    <h2>Son İlanlar</h2>
  </div>

  <div class="listings" id="listings">
    <div class="loading">İlanlar yükleniyor...</div>
  </div>

</main>

<footer>
  © 2026 Samandağ Pazarı — Yerel Alışveriş Platformu
</footer>


<!-- İLAN VER MODALI -->

<div class="modal" id="ilanModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>İlan Ver</h2>

      <button class="close" onclick="closeModal()">
        ×
      </button>
    </div>

    <form id="ilanForm">

      <div class="form-group">
        <label>İlan Başlığı</label>
        <input
          type="text"
          id="baslik"
          placeholder="Örn: iPhone 13"
          required
        >
      </div>

      <div class="form-group">
        <label>Fiyat</label>
        <input
          type="number"
          id="fiyat"
          placeholder="Örn: 25000"
          required
        >
      </div>

      <div class="form-group">
        <label>Kategori</label>

        <select id="kategori" required>
          <option value="">Kategori seçin</option>
          <option value="Araç">🚗 Araç</option>
          <option value="Emlak">🏠 Emlak</option>
          <option value="Elektronik">📱 Elektronik</option>
          <option value="Ev Eşyası">🪑 Ev Eşyası</option>
          <option value="İş İlanları">💼 İş İlanları</option>
          <option value="Diğer">📦 Diğer</option>
        </select>
      </div>

        <label>Mahalle</label>

        <input
          type="text"
          id="mahalle"

        >
      </div>

        <label>Açıklama</label>

        <textarea

        ></textarea>
      </div>

      <button
        type="submit"
        class="submit-btn"

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ================================
     SUPABASE AYARLARI
     ================================ */

  const SUPABASE_URL =
    "https://hicevhodrskuymffgbdo.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wCUwLT4hjbddEjWY_HJEJQ_oTlTeUiB";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* ================================
     İLANLARI GETİR
     ================================ */

  let allListings = [];

  async function loadListings() {

    const listingsContainer =
      document.getElementById("listings");

    listingsContainer.innerHTML =
      '<div class="loading">İlanlar yükleniyor...</div>';

    const { data, error } =
      await supabaseClient
        .from("ilantable")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {

      console.error(error);

      listingsContainer.innerHTML =
        '<div class="empty">İlanlar yüklenirken bir hata oluştu.</div>';

      return;
    }

    allListings = data || [];

    displayListings(allListings);
  }


  /* ================================
     İLANLARI EKRANA YAZ
     ================================ */

  function displayListings(listings) {

    const container =
      document.getElementById("listings");

    if (!listings || listings.length === 0) {

      container.innerHTML =
        '<div class="empty">Henüz ilan bulunmuyor.<br><br>İlk ilanı siz verin!</div>';

      return;
    }

    container.innerHTML = "";

    listings.forEach(ilan => {

      const card =
        document.createElement("div");

      card.className = "card";

      const category =
        ilan.kategori || "Diğer";

      let icon = "📦";

      if (category === "Araç") icon = "🚗";
      if (category === "Emlak") icon = "🏠";
      if (category === "Elektronik") icon = "📱";
      if (category === "Ev Eşyası") icon = "🪑";
      if (category === "İş İlanları") icon = "💼";

      const price =
        ilan.fiyat !== null &&
        ilan.fiyat !== undefined
          ? Number(ilan.fiyat).toLocaleString("tr-TR") + " TL"
          : "Fiyat belirtilmemiş";

      card.dataset.title =
        `${ilan.baslik || ""} ${ilan.aciklama || ""} ${category}`
          .toLowerCase();

      card.innerHTML = `

        <div class="card-image">
          ${icon}
        </div>

        <div class="card-content">

          <h3>
            ${escapeHtml(ilan.baslik || "Başlıksız ilan")}
          </h3>

          <div class="price">
            ${price}
          </div>

          <div class="description">
            ${escapeHtml(ilan.aciklama || "")}
          </div>

          <div class="location">
            📍 ${escapeHtml(ilan.mahalle || "Samandağ")}
          </div>

          <div class="category-label">
            ${escapeHtml(category)}
          </div>

        </div>
      `;

      container.appendChild(card);

    });

  }


  /* ================================
     ARAMA
     ================================ */

  function searchListings(value) {

    const search =
      value.toLowerCase().trim();

    if (search === "") {

      displayListings(allListings);

      return;
    }

    const filtered =
      allListings.filter(ilan => {

        const text = `
          ${ilan.baslik || ""}
          ${ilan.aciklama || ""}
          ${ilan.kategori || ""}
          ${ilan.mahalle || ""}
        `.toLowerCase();

        return text.includes(search);

      });

    displayListings(filtered);
  }


  /* ================================
     KATEGORİ FİLTRESİ
     ================================ */

  function filterCategory(category) {

    const filtered =
      allListings.filter(
        ilan => ilan.kategori === category
      );

    displayListings(filtered);

    window.scrollTo({
      top: document.querySelector(".listings").offsetTop - 100,
      behavior: "smooth"
    });
  }


  /* ================================
     MODAL
     ================================ */

  function openModal() {

    document.getElementById("ilanModal").style.display =
      "block";
  }

  function closeModal() {

    document.getElementById("ilanModal").style.display =
      "none";

    document.getElementById("formMessage").style.display =
      "none";
  }


  /* ================================
     İLAN EKLE
     ================================ */

  document
    .getElementById("ilanForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const submitBtn =
        document.getElementById("submitBtn");

      const message =
        document.getElementById("formMessage");

      submitBtn.disabled = true;
      submitBtn.textContent = "Yayınlanıyor...";

      message.style.display = "none";

      const baslik =
        document.getElementById("baslik").value.trim();

      const fiyat =
        Number(document.getElementById("fiyat").value);

      const kategori =
        document.getElementById("kategori").value;

      const mahalle =
        document.getElementById("mahalle").value.trim();

      const aciklama =
        document.getElementById("aciklama").value.trim();


      const { error } =
        await supabaseClient
          .from("ilantable")
          .insert([
            {
              baslik: baslik,
              fiyat: fiyat,
              aciklama: aciklama,
              kategori: kategori,
              mahalle: mahalle
            }
          ]);


      if (error) {

        console.error(error);

        message.className =
          "message error";

        message.textContent =
          "İlan eklenirken hata oluştu. Lütfen tekrar deneyin.";

        message.style.display = "block";

        submitBtn.disabled = false;
        submitBtn.textContent = "İlanı Yayınla";

        return;
      }


      message.className =
        "message success";

      message.textContent =
        "İlanınız başarıyla yayınlandı!";

      message.style.display = "block";

      document.getElementById("ilanForm").reset();

      await loadListings();

      setTimeout(() => {

        closeModal();

      }, 1500);

      submitBtn.disabled = false;
      submitBtn.textContent = "İlanı Yayınla";

    });


  /* ================================
     GÜVENLİ METİN
     ================================ */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  /* ================================
     SAYFA AÇILINCA İLANLARI GETİR
     ================================ */

  loadListings();

</script>

</body>
</html>
